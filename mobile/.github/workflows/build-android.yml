name: Build Android APK

# Builds a debug APK entirely on GitHub's servers -- no local Android SDK,
# emulator, or Android Studio needed. Trigger it manually from the Actions
# tab, or it runs automatically on every push that touches mobile/ or
# frontend/ (since frontend/index.html gets copied in as the app's content).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "frontend/index.html"
      - "frontend/sw.js"

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Copy web app + sync native project
        run: npm run sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: livecam-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
